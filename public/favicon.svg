<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Galley">
  <!--
    A galley: a proof sheet pulled for marking up. Paper identity, reduced to
    what survives 16px — a warm-white sheet with an ink border, three ink rules,
    and the single restrained blue accent (PAPER.accentYou) as the collaborator
    caret on the last line. Colours track src/lib/paperTheme.ts.
  -->
  <rect x="7" y="3" width="18" height="26" rx="2" fill="#FAF8F4" stroke="#1D1B17" stroke-width="2.5"/>
  <g stroke="#1D1B17" stroke-width="2.5" stroke-linecap="round">
    <line x1="11.5" y1="11" x2="20.5" y2="11"/>
    <line x1="11.5" y1="16" x2="18" y2="16"/>
  </g>
  <line x1="11.5" y1="21" x2="16" y2="21" stroke="#3B5BA5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
