name: CI

# M4.5 T6. Runs the full validation set from docs/IMPLEMENTATION_PLAN.md §11 on
# every push and pull request, so the test suite proves something to a reader who
# has not cloned the repository.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the previous run rather than queueing
# behind it — the older result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The e2e job launches two web servers and a browser; the unit and
    # integration suites finish in seconds. 20 minutes is generous headroom
    # without letting a hung server hold a runner for the default six hours.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned to .nvmrc so CI and the Dockerfile (node:22.22.2) agree. The
      # server depends on node:sqlite, which is version-sensitive.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a drifted
      # package.json fails the build instead of being silently reconciled.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest / jsdom)
        run: npm run test

      - name: Integration tests (Vitest / node)
        run: npm run test:integration

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Only Chromium: playwright.config.ts defines exactly one project.
      # `--with-deps` installs the system libraries the runner image lacks.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      # Catches whitespace errors and conflict markers that no other step sees.
      - name: Whitespace check
        run: git diff --check

      # The Playwright trace/report for a failed run, which is otherwise lost
      # with the runner.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
